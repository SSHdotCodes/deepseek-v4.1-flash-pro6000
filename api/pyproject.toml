[project]
name = "ds41-api"
version = "0.1.0"
description = "OpenAI-compatible serving front-end for DeepSeek-V4.1-Flash-1017 (DS41)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "tokenizers>=0.19",
    "pillow>=10",
    "httpcore>=1.0",  # remote image URLs (ds41_api.vision)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds41_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
