name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scripts-and-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts api/ds41_api
      - run: for f in scripts/*.sh components/attn/build.sh gds/*.sh; do bash -n "$f"; done
      - run: gcc -O2 -Wall -shared -fPIC gds/mountinfo_shim.c -o "$RUNNER_TEMP/mountinfo_shim.so" -ldl
      - run: python -m pip install -r requirements.txt
      - name: API tests with the pinned tokenizer
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tokenizer.json" \
            https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017/resolve/1bae0e1088993b9b82de08f59de5be5a34e42170/tokenizer.json
          echo "c90dfa01249db1be4245780a052ede752e1361c612ac6d08e2bdada7d599476b  $RUNNER_TEMP/tokenizer.json" | sha256sum -c
          cd api && DS41_TOKENIZER="$RUNNER_TEMP/tokenizer.json" python -m pytest -q
